<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f8fb"><title>Timeline — Proje Günlüğü</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#1f293b;background:#f7f8fb}
*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}
.app{display:flex;min-height:100vh}.sidebar{background:white;width:250px;flex:none;border-right:1px solid #e8ebf1;padding:26px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{font-size:22px;font-weight:850;letter-spacing:-1px;padding:0 10px 35px;display:flex;align-items:center;gap:11px}.logo{background:#4054dc;color:#fff;width:35px;height:35px;border-radius:12px;display:grid;place-items:center;font-size:21px}
.label{color:#a2aab9;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1.3px;margin:0 10px 12px}.projects{display:flex;flex-direction:column;gap:5px;overflow-y:auto}
.project{display:flex;gap:10px;align-items:center;width:100%;padding:12px 10px;border:0;border-radius:10px;background:transparent;color:#657184;text-align:left;font-size:13px;font-weight:700}.project.active{background:#eef0ff;color:#354bd0}.project:hover:not(.active){background:#f5f6fa}.dot{width:9px;height:9px;border-radius:50%;background:var(--color);flex:none}.pname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.count{font-size:11px;color:#aab3c0}
.add-project{background:white;border:1px dashed #dce1eb;border-radius:11px;padding:12px;text-align:left;color:#778294;font-size:12px;font-weight:700;margin-top:13px}.add-project:hover{border-color:#4054dc;color:#4054dc}
.sidebar-bottom{margin-top:auto;border-top:1px solid #edf0f5;padding-top:12px;display:grid;gap:5px}.sidebar-bottom button{border:0;background:transparent;text-align:left;color:#768194;padding:10px;font-weight:650;font-size:12px;border-radius:9px}.sidebar-bottom button:hover{background:#f2f4f9}
main{min-width:0;flex:1}.top{height:75px;background:white;border-bottom:1px solid #e8ebf1;padding:0 42px;display:flex;align-items:center;justify-content:space-between;gap:8px}.crumb{font-size:13px;color:#9ba4b2}.crumb strong{color:#404b5e}.date{border:1px solid #e7eaf0;padding:9px 13px;border-radius:999px;color:#6a7789;font-size:12px}
.content{max-width:1700px;margin:auto;padding:43px 42px}.intro{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}.kicker{font-size:11px;letter-spacing:1.7px;color:#5566ce;font-weight:850;margin-bottom:13px}h1{font-size:clamp(28px,3vw,39px);letter-spacing:-1.5px;line-height:1.2;margin:0 0 11px}.desc{color:#8e99a8;font-size:14px;line-height:1.7;margin:0;max-width:650px}
.primary{border:1px solid #3d51db;background:#3d51db;color:#fff;border-radius:11px;padding:12px 17px;font-size:13px;font-weight:750;white-space:nowrap}.primary:hover{background:#3042bf}.secondary{border:1px solid #e0e5ed;background:#fff;color:#687487;border-radius:10px;padding:10px 13px;font-weight:700;font-size:12px}.secondary:hover{border-color:#acb6da;color:#4054dc}
.stats{display:flex;gap:33px;align-items:center;margin:35px 0;flex-wrap:wrap}.stat strong{display:block;font-size:23px;letter-spacing:-.7px}.stat span{display:block;font-size:12px;color:#a0aab8;margin-top:5px}.divider{height:32px;width:1px;background:#e3e7ee}
.panel{border:1px solid #e7ebf1;border-radius:17px;background:#fff;overflow:hidden;box-shadow:0 10px 34px #1d293609}.panel-head{padding:20px 24px;border-bottom:1px solid #edf0f5;display:flex;align-items:center;justify-content:space-between;gap:12px}.panel-head h2{font-size:14px;margin:0 0 5px}.hint{font-size:12px;color:#a0aab8}.actions{display:flex;gap:8px;align-items:center}
select{border:1px solid #e2e7ef;border-radius:9px;color:#687487;padding:10px;background:#fff;font-size:12px;max-width:145px}
.viewport{overflow-x:auto;scrollbar-color:#cbd2df transparent;scrollbar-width:thin}.timeline{position:relative;display:flex;min-width:max-content;padding:83px 43px 42px;min-height:410px}.timeline:before{content:"";position:absolute;left:43px;right:43px;top:129px;height:3px;background:#e7ebf4;border-radius:5px}
.event{position:relative;width:255px;flex:none;padding-right:18px}.event-date{font-size:12px;font-weight:800;color:#617084;position:absolute;top:-29px;left:0}.event-node{position:absolute;top:37px;left:4px;width:20px;height:20px;border-radius:50%;border:5px solid white;background:var(--accent);box-shadow:0 0 0 2px var(--accent);z-index:1}.stem{position:absolute;top:59px;left:13px;width:2px;height:42px;background:#e7ebf2}
.event-card{white-space:normal;border:1px solid #ebedf2;border-radius:13px;padding:17px 16px;box-shadow:0 7px 22px #1b29400a;min-height:175px;margin-top:101px;max-height:280px;overflow:auto}.chip{display:inline-block;font-size:10px;font-weight:850;color:var(--accent);background:var(--tint);border-radius:6px;padding:6px 9px}.event-card h3{font-size:14px;line-height:1.45;margin:14px 0 7px;overflow-wrap:anywhere}.event-card p{font-size:12px;line-height:1.65;color:#8793a3;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}.event-time{font-size:11px;color:#a5afbc;margin-top:14px}
.empty{min-height:390px;display:grid;place-items:center;padding:24px;text-align:center}.empty h2{font-size:19px;margin:0 0 9px}.empty p{font-size:13px;color:#909bac;max-width:365px;line-height:1.7}.empty-icon{font-size:43px;color:#7d8be4;margin-bottom:7px}
.footer{display:flex;justify-content:space-between;gap:15px;color:#a1aab6;font-size:11px;line-height:1.6;margin:18px 3px}
.overlay{position:fixed;inset:0;z-index:20;background:#19233b8a;display:grid;place-items:center;padding:16px}.dialog{width:min(520px,100%);background:#fff;border-radius:18px;padding:28px;box-shadow:0 25px 80px #14203836}.dialog h2{font-size:22px;margin:0 0 9px;letter-spacing:-.6px}.dialog p{font-size:13px;color:#8b97a8;line-height:1.7;margin:0 0 23px}.field{display:block;color:#5c687a;font-size:12px;font-weight:750;margin-bottom:15px}.field input,.field textarea,.field select{display:block;width:100%;margin-top:8px;border:1px solid #e0e5ed;border-radius:10px;outline:none;color:#243146;padding:12px;font-size:13px}.field textarea{height:120px;resize:vertical;line-height:1.6}.field input:focus,.field textarea:focus,.field select:focus{border-color:#5267d9;box-shadow:0 0 0 3px #5267d91b}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:19px}.error{min-height:13px;color:#cb4b52;font-size:12px}.toast{position:fixed;bottom:23px;right:23px;background:#28354c;border-radius:10px;color:white;font-size:12px;padding:13px 17px;z-index:30;box-shadow:0 8px 25px #1d29362b}
@media(max-width:760px){.app{display:block}.sidebar{position:static;height:auto;width:100%;border-right:0;border-bottom:1px solid #e8ebf1;padding:14px}.brand{padding:0 4px 14px}.label{margin:0 8px 9px}.projects{flex-direction:row;overflow-x:auto}.project{flex:none;width:auto}.add-project{margin-top:10px}.sidebar-bottom{margin-top:10px;padding-top:6px;display:flex}.top{height:54px;padding:0 17px}.content{padding:28px 17px}.intro{flex-direction:column}.stats{gap:17px;margin:26px 0}.panel-head{flex-direction:column;align-items:flex-start;padding:17px}.timeline{padding-left:24px;padding-right:24px}.timeline:before{left:24px;right:24px}.event{width:240px}.footer{flex-direction:column}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar"><div class="brand"><div class="logo">↗</div>timeline.</div><div class="label">Projelerim</div><nav class="projects" id="projects"></nav><button class="add-project" id="addProject">＋ Yeni proje oluştur</button>
<div class="sidebar-bottom"><button id="export">↓ JSON dışa aktar</button><button id="import">↑ JSON içe aktar</button><input type="file" id="file" accept=".json,application/json" hidden></div></aside>
<main><header class="top"><div class="crumb">Çalışma alanı / <strong id="crumb">Projelerim</strong></div><span class="date" id="date"></span></header>
<div class="content"><div class="intro"><div><div class="kicker">PROJE GÜNLÜĞÜ</div><h1 id="title">Projelerin, bir arada.</h1><p class="desc" id="description">Her karar, her geliştirme ve her kilometre taşı kendi zamanında.</p></div><button class="primary" id="addEntry">＋ Bugüne kayıt ekle</button></div>
<div class="stats" id="stats"></div>
<section class="panel"><div class="panel-head"><div><h2>Zaman çizelgesi</h2><div class="hint">Geçmiş solda, bugün sağda. Kaydırarak keşfet.</div></div><div class="actions"><select id="filter" aria-label="Kayıt türü"><option value="all">Tüm kayıtlar</option><option value="development">Geliştirme</option><option value="decision">Karar</option><option value="issue">Sorun</option><option value="solution">Çözüm</option><option value="note">Not</option></select><button class="secondary" id="goToday">Bugüne git →</button></div></div><div class="viewport" id="viewport"><div id="timeline"></div></div></section>
<div class="footer"><span>Kayıtların yalnızca bu tarayıcıda tutulur. Düzenli olarak JSON yedeği al.</span><span id="metadata"></span></div></div></main></div>
<div id="modal"></div><div id="notifications" aria-live="polite"></div>
<script>
(()=>{"use strict";
const KEY="timeline.v1",TYPES={development:"Geliştirme",decision:"Karar",issue:"Sorun",solution:"Çözüm",note:"Not"},COLORS={development:["#5263d8","#edf0ff"],decision:["#ad7c32","#fff5e1"],issue:["#c85861","#fff0f1"],solution:["#269a76","#e9f8f0"],note:["#778495","#f0f2f5"]},PALETTE=["#5263d8","#2b9e86","#bf8e48","#bf739c","#7d75ca","#428db4"];
const $=id=>document.getElementById(id),node=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=String(txt);return e};
const day=()=>{const d=new Date;return [d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-")};
const pretty=(s,opts={day:"numeric",month:"short",year:"numeric"})=>new Date(s+"T12:00:00").toLocaleDateString("tr-TR",opts);
const id=()=>crypto.randomUUID?crypto.randomUUID():"id-"+Date.now()+"-"+Math.random().toString(36).slice(2);
const blank=()=>({version:1,projects:[],entries:[]});
function validate(x){
if(!x||x.version!==1||!Array.isArray(x.projects)||!Array.isArray(x.entries)||x.projects.length>1000||x.entries.length>100000)throw Error("Geçersiz veya desteklenmeyen JSON yedeği.");
const ids=new Set(),entries=new Set();
for(const p of x.projects){if(!p||typeof p.id!=="string"||!p.id||ids.has(p.id)||typeof p.name!=="string"||!p.name.trim()||p.name.length>120||typeof p.createdAt!=="string")throw Error("Proje verisi geçersiz.");ids.add(p.id)}
for(const e of x.entries){if(!e||typeof e.id!=="string"||!e.id||entries.has(e.id)||!ids.has(e.projectId)||!TYPES[e.type]||typeof e.title!=="string"||!e.title.trim()||e.title.length>160||typeof e.body!=="string"||e.body.length>12000||typeof e.createdAt!=="string"||typeof e.date!=="string"||!/^\d{4}-\d{2}-\d{2}$/.test(e.date)||Number.isNaN(Date.parse(e.date+"T12:00:00"))||new Date(e.date+"T12:00:00").toISOString().slice(0,10)!==e.date)throw Error("Zaman çizelgesi kaydı geçersiz.");entries.add(e.id)}
return {version:1,projects:x.projects.map(p=>({id:p.id,name:p.name.trim(),description:typeof p.description==="string"?p.description.slice(0,500):"",createdAt:p.createdAt,color:PALETTE.includes(p.color)?p.color:PALETTE[0]})),entries:x.entries.map(e=>({id:e.id,projectId:e.projectId,type:e.type,title:e.title.trim(),body:e.body,date:e.date,createdAt:e.createdAt}))};
}
let data;try{data=validate(JSON.parse(localStorage.getItem(KEY)))}catch{data=blank()}
let selected=data.projects[0]?.id||null;
function persist(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch{notify("Kaydetme başarısız. Depolama kapalı veya dolu.");return false}}
function notify(message){const e=node("div","toast",message);$("notifications").replaceChildren(e);setTimeout(()=>e.remove(),3500)}
function stat(value,label){const e=node("div","stat");e.append(node("strong","",value),node("span","",label));return e}
function divider(){return node("div","divider")}
function dialog(title,info,fields,buttonText,handler){const overlay=node("div","overlay"),form=node("form","dialog"),inputs={};form.append(node("h2","",title),node("p","",info));
for(const f of fields){const label=node("label","field",f.label);let input;if(f.kind==="textarea")input=node("textarea");else if(f.kind==="select"){input=node("select");for(const [k,v] of Object.entries(f.options)){const option=node("option","",v);option.value=k;input.append(option)}}else{input=node("input");input.type="text"}
input.name=f.name;input.required=f.required!==false;input.maxLength=f.max||500;input.placeholder=f.placeholder||"";label.append(input);form.append(label);inputs[f.name]=input}
const err=node("div","error"),actions=node("div","dialog-actions"),cancel=node("button","secondary","İptal"),save=node("button","primary",buttonText);cancel.type="button";cancel.onclick=()=>overlay.remove();save.type="submit";actions.append(cancel,save);form.append(err,actions);form.onsubmit=e=>{e.preventDefault();const values=Object.fromEntries(Object.entries(inputs).map(([k,v])=>[k,v.value.trim()]));try{if(handler(values)!==false)overlay.remove()}catch(e){err.textContent=e.message}};overlay.onclick=e=>{if(e.target===overlay)overlay.remove()};overlay.append(form);$("modal").replaceChildren(overlay);Object.values(inputs)[0]?.focus()}
function newProject(){dialog("Yeni proje oluştur","Her projenin ayrı bir zaman çizelgesi olacak.",[{name:"name",label:"Proje adı",placeholder:"Örn. MetricMon",max:120},{name:"description",label:"Kısa açıklama",placeholder:"Projenin amacı (isteğe bağlı)",required:false,max:500}],"Proje oluştur",v=>{if(!v.name)throw Error("Proje adı boş olamaz.");const project={id:id(),name:v.name,description:v.description,createdAt:new Date().toISOString(),color:PALETTE[data.projects.length%PALETTE.length]};data.projects.push(project);if(!persist()){data.projects.pop();return false}selected=project.id;$("filter").value="all";render();notify("Proje oluşturuldu.")})}
function newEntry(){if(!selected)return newProject();dialog("Bugüne kayıt ekle","Kayıt tarihi bugüne sabitlenir. Önceki tarihleri değiştirmek yerine yeni kayıt ekleyebilirsin.",[{name:"type",label:"Kayıt türü",kind:"select",options:TYPES},{name:"title",label:"Başlık",placeholder:"Bugün ne yaptın?",max:160},{name:"body",label:"Açıklama",kind:"textarea",placeholder:"Karar, gelişme, gerekçe veya teknik not...",required:false,max:12000}],"Kaydı oluştur",v=>{if(!v.title)throw Error("Başlık boş olamaz.");const entry={id:id(),projectId:selected,type:v.type,title:v.title,body:v.body,date:day(),createdAt:new Date().toISOString()};data.entries.push(entry);if(!persist()){data.entries.pop();return false}render();notify("Bugünün kaydı eklendi.")})}
function render(){if(!data.projects.some(p=>p.id===selected))selected=data.projects[0]?.id||null;const p=data.projects.find(p=>p.id===selected),all=p?data.entries.filter(e=>e.projectId===p.id):[];
$("date").textContent=pretty(day(),{day:"numeric",month:"long",year:"numeric"});$("crumb").textContent=p?.name||"Projelerim";$("title").textContent=p?.name||"Projelerin, bir arada.";$("description").textContent=p?.description||(p?"Bu projede alınan kararları ve yapılan çalışmaları kronolojik takip et.":"İlk projeni oluştur, gelişmeleri tarihleriyle saklamaya başla.");$("addEntry").disabled=!p;$("filter").disabled=!p;$("goToday").disabled=!p;
$("projects").replaceChildren(...data.projects.map(project=>{const b=node("button","project"+(project.id===selected?" active":""));const dot=node("span","dot");dot.style.setProperty("--color",project.color);b.append(dot,node("span","pname",project.name),node("span","count",data.entries.filter(e=>e.projectId===project.id).length));b.onclick=()=>{selected=project.id;$("filter").value="all";render()};return b}));
const ordered=[...all].sort((a,b)=>a.date.localeCompare(b.date)||a.createdAt.localeCompare(b.createdAt));$("stats").replaceChildren(stat(all.length,"Toplam kayıt"),divider(),stat(all.filter(e=>e.type==="decision").length,"Alınan karar"),divider(),stat(new Set(all.map(e=>e.date)).size,"Aktif gün"),divider(),stat(ordered.length?pretty(ordered[ordered.length-1].date):"—","Son kayıt"));
$("metadata").textContent=p?p.name+" · "+all.length+" kayıt":"Henüz proje yok";
const filtered=ordered.filter(e=>$("filter").value==="all"||e.type===$("filter").value),wrap=$("timeline");wrap.replaceChildren();
if(!filtered.length){const empty=node("div","empty"),inner=node("div");inner.append(node("div","empty-icon","◇"),node("h2","",p?(all.length?"Bu filtrede kayıt bulunamadı":"Bu hikâye henüz başlamadı"):"Henüz bir proje yok"),node("p","",p?"Bugünün ilk notunu ekle ve projenin geçmişini oluşturmaya başla.":"İlk projeni oluşturduğunda zaman çizelgen burada görünecek."));const button=node("button","primary",p?"＋ İlk kaydı oluştur":"＋ Proje oluştur");button.onclick=p?newEntry:newProject;inner.append(button);empty.append(inner);wrap.append(empty);return}
const line=node("div","timeline");for(const e of filtered){const event=node("div","event");event.style.setProperty("--accent",COLORS[e.type][0]);event.style.setProperty("--tint",COLORS[e.type][1]);const card=node("article","event-card");card.append(node("span","chip",TYPES[e.type]),node("h3","",e.title));if(e.body)card.append(node("p","",e.body));card.append(node("div","event-time",new Date(e.createdAt).toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"})));event.append(node("div","event-date",pretty(e.date)),node("div","event-node"),node("div","stem"),card);line.append(event)}wrap.append(line);requestAnimationFrame(()=>$("viewport").scrollLeft=$("viewport").scrollWidth)}
$("addProject").onclick=newProject;$("addEntry").onclick=newEntry;$("goToday").onclick=()=>$("viewport").scrollTo({left:$("viewport").scrollWidth,behavior:"smooth"});$("filter").onchange=render;
$("export").onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="timeline-backup-"+day()+".json";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify("JSON yedeği indirildi.")};
$("import").onclick=()=>$("file").click();
$("file").onchange=async e=>{const file=e.target.files?.[0];e.target.value="";if(!file)return;try{if(file.size>20*1024*1024)throw Error("Dosya 20 MB sınırını aşıyor.");const imported=validate(JSON.parse(await file.text()));if(!confirm("İçe aktarma mevcut tüm proje ve kayıtların yerini alacak. Devam etmek istiyor musun?"))return;const old=data;data=imported;if(!persist()){data=old;return}selected=data.projects[0]?.id||null;$("filter").value="all";render();notify("JSON yedeği içe aktarıldı.")}catch(err){alert("İçe aktarma başarısız: "+err.message)}};
render();
})();
</script>
</body></html>
