/* V2 — Date clusters and motion */
.timeline{gap:16px;min-height:380px;padding-top:87px;padding-bottom:48px}
.timeline:before{top:133px;height:3px;background:linear-gradient(90deg,#dbe0f9,#6173e7,#d7def8);background-size:200% 100%;animation:flowLine 8s linear infinite}
.event{width:265px;padding-right:0;animation:revealCard .48s both;animation-delay:var(--delay,0ms)}
.event-date{top:-32px;letter-spacing:.2px}
.event-node{top:37px;transition:transform .25s ease,box-shadow .25s ease}
.event:hover .event-node{transform:scale(1.25);box-shadow:0 0 0 5px #6173e522}
.stem{height:39px}
.event-card{margin-top:96px;padding:13px 12px;min-height:94px;max-height:300px;overflow:auto;background:linear-gradient(160deg,#fff,#fdfdff);transition:box-shadow .25s,transform .25s,border-color .25s}
.event:hover .event-card{transform:translateY(-4px);box-shadow:0 14px 30px #3543a41c;border-color:#d8ddf5}
.day-meta{display:flex;align-items:center;justify-content:space-between;color:#95a0b3;font-size:11px;font-weight:750;margin:2px 3px 9px}
.day-badge{border-radius:99px;padding:4px 8px;background:#f0f2fc;color:#6270c5}
.entry-title{width:100%;display:flex;align-items:center;gap:8px;padding:11px 7px;text-align:left;border:0;border-top:1px solid #f0f2f6;background:transparent;border-radius:6px;transition:background .18s,transform .18s}
.entry-title:hover{background:#f3f5ff;transform:translateX(3px)}
.entry-title:focus-visible{outline:2px solid #5263d8;outline-offset:2px}
.entry-marker{height:8px;width:8px;border-radius:50%;flex:none;background:var(--entry-color)}
.entry-title-text{min-width:0;flex:1;color:#3c485a;font-size:12px;font-weight:700;line-height:1.45;overflow-wrap:anywhere}
.entry-arrow{font-size:15px;color:#b5bcd0}
.detail-card{width:min(560px,100%)}
.detail-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.detail-top .chip{font-size:11px}
.detail-date{color:#8793a6;font-size:12px}
.detail-title{line-height:1.35;overflow-wrap:anywhere}
.detail-body{font-size:14px!important;white-space:pre-wrap;overflow-wrap:anywhere;color:#586578!important;margin:14px 0!important}
.detail-actions{display:flex;justify-content:flex-end;margin-top:24px}
.dialog{animation:popIn .23s cubic-bezier(.2,.8,.2,1) both}
.overlay{animation:fadeIn .18s both}
.viewport{scroll-behavior:smooth}
@keyframes revealCard{from{opacity:0;transform:translateY(22px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes popIn{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes flowLine{0%{background-position:200% 0}100%{background-position:0 0}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;scroll-behavior:auto!important;transition:none!important}}

/* Day focus and local Markdown preview */
.day-focus{padding:27px 31px 34px;min-height:370px;animation:fadeIn .25s both}
.day-back{margin-bottom:19px}.day-heading{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:22px;flex-wrap:wrap}
.day-heading h2{font-size:26px;letter-spacing:-.8px;margin:0 0 6px}.day-heading p{margin:0;color:#94a0af;font-size:13px}
.day-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:14px}
.day-record{border:1px solid #e7eaf2;background:#fff;border-radius:14px;padding:18px 19px;box-shadow:0 5px 16px #18283b08;animation:revealCard .35s both}
.day-record h3{font-size:16px;line-height:1.5;margin:12px 0 8px;overflow-wrap:anywhere}
.day-record .detail-body{font-size:13px!important;margin:10px 0!important;max-height:260px;overflow:auto}
.day-record .detail-date{font-size:11px}.day-record .record-link{margin-top:13px}
.day-open{background:transparent;border:0;padding:0;color:#495dcf;font-size:12px;font-weight:750;text-align:left}
.day-date-link{border:0;background:transparent;padding:0;text-align:left;font-size:12px;font-weight:800;color:#617084;cursor:pointer;white-space:nowrap}
.day-date-link:hover,.day-open:hover{color:#3544af;text-decoration:underline}
.event-card .day-meta button{border:0;background:transparent;color:#6270c5;cursor:pointer;font-size:11px;font-weight:750;padding:4px}
.event-card .day-meta button:hover{text-decoration:underline}
.md-view{white-space:normal!important;line-height:1.65;overflow-wrap:anywhere}
.md-view p{margin:6px 0 10px!important;color:inherit!important;font-size:inherit!important;white-space:pre-wrap}
.md-view h3,.md-view h4{margin:11px 0 7px;font-size:1.05em}.md-view ul{margin:8px 0;padding-left:20px}.md-view li{margin:4px 0}
.md-view code{background:#edf0f8;border-radius:4px;padding:2px 4px;font-size:.92em}
.md-view pre{background:#263246;color:#edf2ff;border-radius:9px;padding:12px;overflow-x:auto}
.md-view pre code{background:transparent;color:inherit;padding:0}
.editor-tools{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:6px 0 12px}
.editor-tools button{border:1px solid #e3e7f0;background:#f8f9fd;color:#5363b9;border-radius:8px;font-size:11px;font-weight:700;padding:8px 10px}
.editor-help{font-size:11px;color:#97a2b3}.preview-box{border:1px solid #e8ebf2;background:#fafbfe;border-radius:10px;padding:12px;min-height:90px;max-height:240px;overflow-y:auto;font-size:13px;color:#4d596b;margin:0 0 12px}
@media(max-width:760px){.day-focus{padding:20px 15px}.day-heading h2{font-size:22px}}

/* Search across workspace, project and day */
.search-launch{border:1px solid #e5e9f2;background:#fff;border-radius:10px;padding:9px 12px;display:flex;align-items:center;gap:8px;font-size:12px;color:#718096;transition:border-color .2s,color .2s}
.search-launch:hover{border-color:#9da9df;color:#4054dc}.search-launch kbd{font-size:10px;color:#aab2c0;border:1px solid #e7ebf2;border-radius:5px;padding:2px 5px;margin-left:16px}
.top-right{display:flex;align-items:center;gap:12px}.search-dialog{width:min(710px,100%);max-height:min(82vh,750px);display:flex;flex-direction:column;padding:22px}
.search-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.search-heading h2{margin:0}
.search-controls{display:flex;gap:9px;margin-bottom:12px}.search-query{flex:1;min-width:0;border:1px solid #dce2ef;border-radius:10px;padding:12px 14px;color:#263449;outline:none}.search-query:focus{border-color:#6173e7;box-shadow:0 0 0 3px #6173e720}
.search-scope{max-width:180px;font-size:12px}.search-count{font-size:12px;color:#919bad;margin:0 0 10px}
.search-results{overflow-y:auto;min-height:95px;display:grid;align-content:start;gap:8px}
.search-result{border:1px solid #e9edf5;background:#fff;text-align:left;border-radius:11px;padding:13px 14px;transition:border-color .2s,transform .2s,background .2s;width:100%}
.search-result:hover{border-color:#aebaf3;background:#f9faff;transform:translateY(-2px)}
.search-result strong{display:block;font-size:13px;color:#354157;margin:6px 0;overflow-wrap:anywhere}
.search-result small{display:block;font-size:11px;color:#9aa4b2;line-height:1.6}
.search-result p{font-size:12px!important;color:#7c899b!important;line-height:1.5!important;margin:0!important;overflow-wrap:anywhere}
.search-empty{text-align:center;padding:30px 12px;color:#9aa5b3;font-size:13px}
@media(max-width:760px){.search-launch kbd{display:none}.search-launch{padding:9px}.top-right{gap:5px}.search-dialog{padding:16px}.search-controls{flex-direction:column}.search-scope{max-width:none}}

/* V5: clear category groups inside each day */
.event-card{max-height:340px;scrollbar-width:thin;scrollbar-color:#d6dced transparent}
.category-section{border:1px solid var(--group-border);background:var(--group-bg);border-radius:11px;overflow:hidden;margin-top:9px}
.category-header{display:flex;align-items:center;gap:7px;padding:9px 10px;color:var(--group-accent);font-size:11px;font-weight:800;letter-spacing:.1px}
.category-indicator{width:7px;height:7px;flex:none;border-radius:50%;background:var(--group-accent)}
.category-number{margin-left:auto;font-size:10px;font-weight:750;opacity:.78}
.category-section .entry-title{padding:9px 10px;background:#fff;border-top:1px solid var(--group-border);border-radius:0}
.category-section .entry-title:hover{background:var(--group-bg);transform:none}
.category-section .entry-title-text{font-size:12px}
.event-card .day-meta{margin:2px 3px 12px}
.day-category{grid-column:1/-1;margin-top:5px;display:flex;align-items:center;gap:9px;font-size:13px;font-weight:800;color:var(--group-accent)}
.day-category:after{content:"";flex:1;height:1px;background:var(--group-border)}
.day-category-count{font-size:11px;color:#9aa5b2;font-weight:600}
.day-record{border-left:3px solid var(--record-color,#e7eaf2)}
@media(max-width:760px){.event-card{max-height:300px}}

/* Record actions */
.detail-actions{gap:9px;align-items:center;flex-wrap:wrap}
.detail-actions .danger-button{margin-right:auto}
.danger-button{border:1px solid #f4d5d8;background:#fff5f5;color:#b74250;border-radius:10px;padding:10px 13px;font-weight:750;font-size:12px}
.danger-button:hover{background:#ffe8ea;border-color:#e6aab3}
.edit-date-note{background:#f5f7ff;border:1px solid #e5e9fa;border-radius:9px;padding:10px 12px;font-size:12px;color:#6575a1;margin-bottom:14px}

/* Recoverable records */
.sidebar-bottom #trash{display:flex;justify-content:space-between;align-items:center;color:#61708c}
#trashCount:not(:empty){background:#edf0fb;color:#4f60c5;padding:2px 8px;border-radius:99px}
.trash-dialog{width:min(760px,100%);max-height:min(86vh,840px);display:flex;flex-direction:column}
.trash-list{overflow:auto;display:grid;gap:10px;min-height:80px}
.trash-item{border:1px solid #e9edf4;border-radius:12px;padding:14px;display:grid;gap:9px}
.trash-item strong{font-size:13px;overflow-wrap:anywhere}
.trash-item small{color:#97a3b2;font-size:11px}
.trash-buttons{display:flex;gap:8px;flex-wrap:wrap}
.trash-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.trash-empty{padding:28px 12px;text-align:center;color:#98a3b0;font-size:13px}

/* V8 — Softer, calmer visual language without changing functionality */

.panel-head{padding:22px 25px;border-bottom-color:#f0f2f7}

select{background:#fff;border-color:#e5eaf3;border-radius:11px;padding:11px 12px}
.search-launch{border-color:#e5eaf4;border-radius:12px;color:#77859b;padding:10px 13px}

<script>
(()=>{"use strict";

for(const p of x.projects){if(!p||typeof p.id!=="string"||!p.id||ids.has(p.id)||typeof p.name!=="string"||!p.name.trim()||p.name.length>120||typeof p.createdAt!=="string")throw Error("Proje verisi geçersiz.");ids.add(p.id)}
for(const e of x.entries){if(!e||(e.deletedAt!==undefined&&(typeof e.deletedAt!=="string"||Number.isNaN(Date.parse(e.deletedAt))))||typeof e.id!=="string"||!e.id||entries.has(e.id)||!ids.has(e.projectId)||!TYPES[e.type]||typeof e.title!=="string"||!e.title.trim()||e.title.length>160||typeof e.body!=="string"||e.body.length>12000||typeof e.createdAt!=="string"||typeof e.date!=="string"||!/^\d{4}-\d{2}-\d{2}$/.test(e.date)||Number.isNaN(Date.parse(e.date+"T12:00:00"))||new Date(e.date+"T12:00:00").toISOString().slice(0,10)!==e.date)throw Error("Zaman çizelgesi kaydı geçersiz.");entries.add(e.id)}
for(const e of x.entries){if(e.relations!==undefined){if(!Array.isArray(e.relations)||e.relations.length>200)throw Error("Kayıt bağlantıları geçersiz.");for(const rel of e.relations){if(!rel||!["resolves","continues","related"].includes(rel.type)||typeof rel.targetId!=="string"||!rel.targetId||rel.targetId===e.id)throw Error("Kayıt bağlantısı geçersiz.")}}}

let data;try{data=validate(JSON.parse(localStorage.getItem(KEY)))}catch{data=blank()}

function dialog(title,info,fields,buttonText,handler){const overlay=node("div","overlay"),form=node("form","dialog"),inputs={};form.append(node("h2","",title),node("p","",info));
for(const f of fields){const label=node("label","field",f.label);let input;if(f.kind==="textarea")input=node("textarea");else if(f.kind==="select"){input=node("select");for(const [k,v] of Object.entries(f.options)){const option=node("option","",v);option.value=k;input.append(option)}}else{input=node("input");input.type="text"}
input.name=f.name;input.required=f.required!==false;input.maxLength=f.max||500;input.placeholder=f.placeholder||"";label.append(input);form.append(label);inputs[f.name]=input}
const err=node("div","error"),actions=node("div","dialog-actions"),cancel=node("button","secondary","İptal"),save=node("button","primary",buttonText);cancel.type="button";cancel.onclick=()=>overlay.remove();save.type="submit";actions.append(cancel,save);form.append(err,actions);form.onsubmit=e=>{e.preventDefault();const values=Object.fromEntries(Object.entries(inputs).map(([k,v])=>[k,v.value.trim()]));try{if(handler(values)!==false)overlay.remove()}catch(e){err.textContent=e.message}};overlay.onclick=e=>{if(e.target===overlay)overlay.remove()};overlay.append(form);$("modal").replaceChildren(overlay);Object.values(inputs)[0]?.focus()}
function newProject(){dialog("Yeni proje oluştur","Her projenin ayrı bir zaman çizelgesi olacak.",[{name:"name",label:"Proje adı",placeholder:"Örn. MetricMon",max:120},{name:"description",label:"Kısa açıklama",placeholder:"Projenin amacı (isteğe bağlı)",required:false,max:500}],"Proje oluştur",v=>{if(!v.name)throw Error("Proje adı boş olamaz.");const project={id:id(),name:v.name,description:v.description,createdAt:new Date().toISOString(),color:PALETTE[data.projects.length%PALETTE.length]};data.projects.push(project);if(!persist()){data.projects.pop();return false}selected=project.id;selectedDay=null;$("filter").value="all";render();notify("Proje oluşturuldu.")})}
function attachEditorTools(){
const dialogEl=$("modal").querySelector(".dialog"),body=dialogEl?.querySelector('[name="body"]');if(!body)return;
const tools=node("div","editor-tools"),format=node("button","","Akıllı biçimlendir"),previewBtn=node("button","","Önizlemeyi göster"),help=node("span","editor-help","Yerel kurallar · LLM yok");

format.onclick=()=>{if(!body.value.trim())return;body.value=formatSimpleMarkdown(body.value);body.dispatchEvent(new Event("input"));preview.replaceChildren(renderMarkdown(body.value));notify("Markdown önerisi uygulandı. Kaydetmeden önce kontrol et.")};

function newEntry(){
if(!selected)return newProject();
dialog("Bugüne kayıt ekle","Bugünün tarihine eklenir. Yazdığın metni istersen kurallarla Markdown biçimine dönüştürebilirsin.",[{name:"type",label:"Kayıt türü",kind:"select",options:TYPES},{name:"title",label:"Başlık",placeholder:"Bugün ne yaptın?",max:160},{name:"body",label:"Açıklama (Markdown destekler)",kind:"textarea",placeholder:"Serbestçe yazabilir ya da Markdown kullanabilirsin...",required:false,max:12000}],"Kaydı oluştur",v=>{

data.entries.push(entry);if(!persist()){data.entries.pop();return false}render();notify("Bugünün kaydı eklendi.");

}

function renderMarkdown(textContent){
const host=node("div","md-view"),lines=String(textContent||"").split(/\r?\n/);let list=null,pre=null;
function inline(parent,str){const parts=str.split(/(`[^`]+`|\*\*[^*]+\*\*)/g);for(const part of parts){if(part.startsWith("`")&&part.endsWith("`")&&part.length>2)parent.append(node("code","",part.slice(1,-1)));else if(part.startsWith("**")&&part.endsWith("**")&&part.length>4)parent.append(node("strong","",part.slice(2,-2)));else parent.append(document.createTextNode(part))}}

function formatSimpleMarkdown(raw){
const lines=raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
if(lines.some(x=>/^([#*-] |\d+\. |```)/.test(x)))return raw;
const sections=[["Sorun",/\b(sorun|hata|timeout|başarısız|problem|çalışmıyor)\b/i],["Kontrol",/\b(kontrol|incele|test|doğrula)\w*/i],["Çözüm",/\b(çöz|düzelt|artır|değiştir|güncelle|uygula)\w*/i],["Karar",/\b(karar|tercih|seçtik|belirledik)\b/i],["Takip",/\b(ileride|sonra|tekrar bak|takip|yapılacak|kalıcı değil)\b/i]];

function editEntry(entry){
const current=data.entries.find(x=>x.id===entry.id&&!x.deletedAt);if(!current){notify("Kayıt artık bulunmuyor.");return}

{name:"type",label:"Kayıt türü",kind:"select",options:TYPES},
{name:"title",label:"Başlık",max:160,placeholder:"Kayıt başlığı"},
{name:"body",label:"Açıklama (Markdown destekler)",kind:"textarea",required:false,max:12000}
],"Değişiklikleri kaydet",values=>{

if(!item)throw Error("Kayıt bulunamadı.");

const panel=$("modal").querySelector(".dialog");

function deleteEntry(entry){
const item=data.entries.find(x=>x.id===entry.id&&!x.deletedAt);if(!item){notify("Kayıt bulunamadı.");return}

const REL_TYPES={resolves:"Çözüyor",continues:"Devamı",related:"İlgili"};

function editRelations(entry){

const overlay=node("div","overlay"),panel=node("section","dialog"),heading=node("h2","","Bağlantı ekle"),intro=node("p","","Bu kaydı aynı projedeki başka bir kayıtla ilişkilendir.");

function removeRelation(sourceId,type,targetId){

let selectedEntryId=null;

for(const x of [...outgoing,...incoming]){

const list=node("div","trash-list");panel.append(list);
function draw(){
const deleted=data.entries.filter(e=>e.deletedAt).sort((a,b)=>b.deletedAt.localeCompare(a.deletedAt));list.replaceChildren();
if(!deleted.length){list.append(node("div","trash-empty","Çöp kutusu boş."));return}
for(const e of deleted){

item.append(node("strong","",e.title),node("small","",(project?.name||"Proje")+" · "+pretty(e.date)+" · "+TYPES[e.type]+" · Silinme: "+new Date(e.deletedAt).toLocaleString("tr-TR")));
const controls=node("div","trash-buttons"),restore=node("button","secondary","Geri yükle"),destroy=node("button","danger-button","Kalıcı sil");
restore.type="button";destroy.type="button";
restore.onclick=()=>{const old=e.deletedAt;delete e.deletedAt;if(!persist()){e.deletedAt=old;return}render();draw();notify("Kayıt orijinal tarihine geri yüklendi.")};
destroy.onclick=()=>{if(!confirm("“"+e.title+"” kalıcı olarak silinsin mi? Bu işlem geri alınamaz."))return;const idx=data.entries.indexOf(e);if(idx<0)return;data.entries.splice(idx,1);if(!persist()){data.entries.splice(idx,0,e);return}render();draw();notify("Kayıt kalıcı olarak silindi.")};

}
function dismiss(){overlay.remove();document.removeEventListener("keydown",onKey)}
function onKey(e){if(e.key==="Escape")dismiss()}
close.onclick=dismiss;overlay.onclick=e=>{if(e.target===overlay)dismiss()};document.addEventListener("keydown",onKey);overlay.append(panel);$("modal").replaceChildren(overlay);draw();close.focus();
}
function searchText(value){return String(value||"").toLocaleLowerCase("tr-TR").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/ı/g,"i")}
function openSearch(){
const overlay=node("div","overlay"),panel=node("section","dialog search-dialog"),heading=node("div","search-heading");
heading.append(node("h2","","Kayıtlarda ara"));
const close=node("button","secondary","Kapat");close.type="button";heading.append(close);panel.append(heading);
const controls=node("div","search-controls"),query=node("input","search-query"),scope=node("select","search-scope");
query.type="search";query.placeholder="Başlık, açıklama, proje, tarih veya kayıt türü...";query.setAttribute("aria-label","Arama metni");
const choices=[["all","Tüm projeler"]];if(selected)choices.push(["project","Bu proje"]);if(selected&&selectedDay)choices.push(["day","Bu gün"]);
for(const [key,label] of choices){const opt=node("option","",label);opt.value=key;scope.append(opt)}
scope.value=selectedDay?"day":selected?"project":"all";scope.setAttribute("aria-label","Arama kapsamı");
controls.append(query,scope);panel.append(controls);
const count=node("div","search-count"),results=node("div","search-results");results.setAttribute("aria-live","polite");panel.append(count,results);
function update(){
const tokens=searchText(query.value.trim()).split(/\s+/).filter(Boolean);
const matches=data.entries.filter(e=>{if(e.deletedAt)return false;
if(scope.value==="project"&&e.projectId!==selected)return false;
if(scope.value==="day"&&(e.projectId!==selected||e.date!==selectedDay))return false;
const project=data.projects.find(p=>p.id===e.projectId);
const haystack=searchText([e.title,e.body,e.date,pretty(e.date),TYPES[e.type],project?.name,project?.description].join(" "));
return tokens.every(word=>haystack.includes(word));
}).sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt.localeCompare(a.createdAt));
results.replaceChildren();
count.textContent=tokens.length?matches.length+" eşleşen kayıt":matches.length+" kayıt · Aramaya başlayabilirsin";
for(const e of matches.slice(0,80)){
const p=data.projects.find(p=>p.id===e.projectId),row=node("button","search-result");row.type="button";
row.append(node("small","",(p?.name||"Proje")+" · "+pretty(e.date)+" · "+TYPES[e.type]),node("strong","",e.title));
if(e.body){const excerpt=e.body.replace(/[#*\x60]/g," ").replace(/\s+/g," ").trim();row.append(node("p","",excerpt.length>160?excerpt.slice(0,160)+"…":excerpt))}
row.onclick=()=>{selected=e.projectId;selectedDay=e.date;$("filter").value="all";dismiss();render();showEntry(e)};
results.append(row)}
if(!matches.length)results.append(node("div","search-empty","Eşleşen kayıt bulunamadı."));
if(matches.length>80)results.append(node("div","search-count","İlk 80 sonuç gösteriliyor. Aramanı daraltabilirsin."));
}
const onKey=e=>{if(e.key==="Escape"){e.preventDefault();dismiss()}};
function dismiss(){document.removeEventListener("keydown",onKey);overlay.remove()}
close.onclick=dismiss;overlay.onclick=e=>{if(e.target===overlay)dismiss()};query.oninput=update;scope.onchange=update;
document.addEventListener("keydown",onKey);overlay.append(panel);$("modal").replaceChildren(overlay);update();query.focus();
}
function openDay(date){selectedDay=date;render()}
function groupByType(items){
const groups=new Map();
for(const item of items){if(!groups.has(item.type))groups.set(item.type,[]);groups.get(item.type).push(item)}
return groups;
}
function typeGroupStyle(el,type){
const color=COLORS[type];el.style.setProperty("--group-accent",color[0]);el.style.setProperty("--group-bg",color[1]);el.style.setProperty("--group-border",color[0]+"27");
}
function makeEntryRow(entry){

row.type="button";row.style.setProperty("--entry-color",COLORS[entry.type][0]);row.title=TYPES[entry.type]+" — detayı aç";
row.setAttribute("aria-label",entry.title+" — "+TYPES[entry.type]+" detayını aç");
row.append(marker,node("span","entry-title-text",entry.title));const tag=relationBadge(entry);if(tag)row.append(tag);row.append(node("span","entry-arrow","›"));
row.onclick=()=>showEntry(entry);return row;
}
function renderDay(date,items){
const wrap=$("timeline");wrap.replaceChildren();
const focus=node("div","day-focus"),back=node("button","secondary day-back","← Tüm zaman çizelgesine dön");
back.onclick=()=>{selectedDay=null;render()};focus.append(back);
const heading=node("div","day-heading"),headingLeft=node("div");
headingLeft.append(node("h2","",pretty(date,{day:"numeric",month:"long",year:"numeric"})),node("p","",items.length+" kayıt · "+(data.projects.find(p=>p.id===selected)?.name||"Proje")));

if(date===day()){const add=node("button","primary","＋ Bugüne kayıt ekle");add.onclick=newEntry;heading.append(add)}
focus.append(heading);
const list=node("div","day-list");let index=0;
for(const [type,records] of groupByType(items)){
const heading=node("div","day-category");typeGroupStyle(heading,type);
heading.append(node("span","category-indicator"),node("span","",TYPES[type]),node("span","day-category-count",records.length+" kayıt"));list.append(heading);
for(const e of records){

badge.style.setProperty("--accent",COLORS[e.type][0]);badge.style.setProperty("--tint",COLORS[e.type][1]);

card.append(badge,node("h3","",e.title),node("span","detail-date",new Date(e.createdAt).toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"})));const badgeLink=relationBadge(e);if(badgeLink)card.append(badgeLink);
if(e.body)card.append(renderMarkdown(e.body));

}
focus.append(list);wrap.append(focus);
$("goToday").textContent="Tüm günler →";$("goToday").onclick=()=>{selectedDay=null;render()};
}
function render(){if(!data.projects.some(p=>p.id===selected))selected=data.projects[0]?.id||null;const p=data.projects.find(p=>p.id===selected),all=p?data.entries.filter(e=>e.projectId===p.id&&!e.deletedAt):[];
$("goToday").textContent="Bugüne git →";$("goToday").onclick=()=>{selectedDay=null;render();$("viewport").scrollTo({left:$("viewport").scrollWidth,behavior:"smooth"})};$("date").textContent=pretty(day(),{day:"numeric",month:"long",year:"numeric"});$("crumb").textContent=p?.name||"Projelerim";$("title").textContent=p?.name||"Projelerin, bir arada.";$("description").textContent=p?.description||(p?"Bu projede alınan kararları ve yapılan çalışmaları kronolojik takip et.":"İlk projeni oluştur, gelişmeleri tarihleriyle saklamaya başla.");$("addEntry").disabled=!p;$("filter").disabled=!p;$("goToday").disabled=!p;
$("projects").replaceChildren(...data.projects.map(project=>{const b=node("button","project"+(project.id===selected?" active":""));const dot=node("span","dot");dot.style.setProperty("--color",project.color);b.append(dot,node("span","pname",project.name),node("span","count",data.entries.filter(e=>e.projectId===project.id&&!e.deletedAt).length));b.onclick=()=>{selected=project.id;selectedDay=null;$("filter").value="all";render()};return b}));
const ordered=[...all].sort((a,b)=>a.date.localeCompare(b.date)||a.createdAt.localeCompare(b.createdAt));$("stats").replaceChildren(stat(all.length,"Toplam kayıt"),divider(),stat(all.filter(e=>e.type==="decision").length,"Alınan karar"),divider(),stat(new Set(all.map(e=>e.date)).size,"Aktif gün"),divider(),stat(ordered.length?pretty(ordered[ordered.length-1].date):"—","Son kayıt"));
$("trashCount").textContent=data.entries.filter(e=>e.deletedAt).length||"";$("metadata").textContent=p?p.name+" · "+all.length+" kayıt":"Henüz proje yok";
const filtered=ordered.filter(e=>$("filter").value==="all"||e.type===$("filter").value),wrap=$("timeline");wrap.replaceChildren();if(selectedDay){renderDay(selectedDay,filtered.filter(e=>e.date===selectedDay));return}
if(!filtered.length){const empty=node("div","empty"),inner=node("div");inner.append(node("div","empty-icon","◇"),node("h2","",p?(all.length?"Bu filtrede kayıt bulunamadı":"Bu hikâye henüz başlamadı"):"Henüz bir proje yok"),node("p","",p?"Bugünün ilk notunu ekle ve projenin geçmişini oluşturmaya başla.":"İlk projeni oluşturduğunda zaman çizelgen burada görünecek."));const button=node("button","primary",p?"＋ İlk kaydı oluştur":"＋ Proje oluştur");button.onclick=p?newEntry:newProject;inner.append(button);empty.append(inner);wrap.append(empty);return}
const line=node("div","timeline"),groups=new Map();
for(const entry of filtered){if(!groups.has(entry.date))groups.set(entry.date,[]);groups.get(entry.date).push(entry)}
let index=0;
for(const [date,items] of groups){
const event=node("div","event"),accent=items.length===1?COLORS[items[0].type][0]:"#5263d8";
event.style.setProperty("--accent",accent);event.style.setProperty("--delay",Math.min(index++,10)*45+"ms");
const card=node("article","event-card"),meta=node("div","day-meta");
meta.append(node("span","",items.length===1?"Günlük kayıt":"Günlük kayıtlar"),node("span","day-badge",items.length+" kayıt"));card.append(meta);
for(const [type,entries] of groupByType(items)){
const section=node("section","category-section"),header=node("div","category-header");typeGroupStyle(section,type);
header.append(node("span","category-indicator"),node("span","",TYPES[type]),node("span","category-number",entries.length+" kayıt"));
section.append(header);for(const entry of entries)section.append(makeEntryRow(entry));card.append(section)}
const dateButton=node("button","day-date-link event-date",pretty(date));dateButton.onclick=()=>openDay(date);const openDayBtn=node("button","","Günü aç →");openDayBtn.onclick=()=>openDay(date);meta.append(openDayBtn);card.onclick=ev=>{if(ev.target===card||ev.target===meta)openDay(date)};event.append(dateButton,node("div","event-node"),node("div","stem"),card);line.append(event)}
if(groups.size===1)line.classList.add("single-day");wrap.append(line);requestAnimationFrame(()=>{$("viewport").scrollLeft=$("viewport").scrollWidth})}

$("trash").onclick=openTrash;$("openSearch").onclick=openSearch;document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();if(!$("modal").querySelector(".overlay"))openSearch()}});$("addProject").onclick=newProject;$("addEntry").onclick=newEntry;$("goToday").onclick=()=>$("viewport").scrollTo({left:$("viewport").scrollWidth,behavior:"smooth"});$("filter").onchange=render;
$("export").onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="timeline-backup-"+day()+".json";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify("JSON yedeği indirildi.")};
$("import").onclick=()=>$("file").click();
$("file").onchange=async e=>{const file=e.target.files?.[0];e.target.value="";if(!file)return;try{if(file.size>20*1024*1024)throw Error("Dosya 20 MB sınırını aşıyor.");const imported=validate(JSON.parse(await file.text()));if(!confirm("İçe aktarma mevcut tüm proje ve kayıtların yerini alacak. Devam etmek istiyor musun?"))return;const old=data;data=imported;if(!persist()){data=old;return}selected=data.projects[0]?.id||null;selectedDay=null;$("filter").value="all";render();notify("JSON yedeği içe aktarıldı.")}catch(err){alert("İçe aktarma başarısız: "+err.message)}};
render();
})();
